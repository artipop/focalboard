name: Production-Release

on: workflow_dispatch

env:
 EXCLUDE_ENTERPRISE: true
 BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:

  ubuntu:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: "focalboard"

    - name: Replace token 1 server
      run: sed -i -e "s,placeholder_rudder_dataplane_url,${{ secrets.RUDDER_DATAPLANE_URL }},g" ${{ github.workspace }}/focalboard/server/services/telemetry/telemetry.go

    - name: Replace token 2 server
      run: sed -i -e "s,placeholder_rudder_key,${{ secrets.RUDDER_PROD_KEY }},g" ${{ github.workspace }}/focalboard/server/services/telemetry/telemetry.go

    - name: npm ci
      run: cd focalboard/webapp; npm ci --no-optional

    - name: Set up Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version: 1.21

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 20.11.0

    - name: apt-get update
      run: sudo apt-get update

    - name: apt-get install -y libgtk-3-dev
      run: sudo apt-get install -y libgtk-3-dev

    - name: apt-get install -y libwebkit2gtk-4.0-dev
      run: sudo apt-get install -y libwebkit2gtk-4.0-dev

    - name: Install Wails CLI
      run: |
        go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Build Linux server and Wails app
      run: cd focalboard; make server-linux-package linux-app-wails
      env:
        BUILD_NUMBER: ${{ github.run_id }}

    - name: Upload server package
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: focalboard-server-linux-amd64.tar.gz
        path: ${{ github.workspace }}/focalboard/dist/focalboard-server-linux-amd64.tar.gz

    - name: Upload app package
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: focalboard-linux.tar.gz
        path: ${{ github.workspace }}/focalboard/desktop/build/bin/focalboard-linux.tar.gz

  macos:
    runs-on: macos-15

    steps:

    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: "focalboard"

    - name: Replace token 1 server
      run: sed -i -e "s,placeholder_rudder_dataplane_url,${{ secrets.RUDDER_DATAPLANE_URL }},g" ${{ github.workspace }}/focalboard/server/services/telemetry/telemetry.go

    - name: Replace token 2 server
      run: sed -i -e "s,placeholder_rudder_key,${{ secrets.RUDDER_PROD_KEY }},g" ${{ github.workspace }}/focalboard/server/services/telemetry/telemetry.go

    - name: npm ci
      run: cd focalboard/webapp; npm ci --no-optional

    - name: Set up Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version: 1.21

    - name: List Xcode versions
      run: ls -n /Applications/ | grep Xcode*

    - name: Install Wails CLI
      run: |
        go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Build macOS
      run: cd focalboard; make mac-app-wails
      env:
        DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
        BUILD_NUMBER: ${{ github.run_id }}

    - name: Upload macOS package
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: focalboard-mac.zip
        path: ${{ github.workspace }}/focalboard/desktop/build/bin/focalboard-mac.zip

  windows:
    runs-on: windows-2025

    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        path: "focalboard"

    - name: Replace token 1 server
      run: sed -i -e "s,placeholder_rudder_dataplane_url,${{ secrets.RUDDER_DATAPLANE_URL }},g" ${{ github.workspace }}/focalboard/server/services/telemetry/telemetry.go

    - name: Replace token 2 server
      run: sed -i -e "s,placeholder_rudder_key,${{ secrets.RUDDER_PROD_KEY }},g" ${{ github.workspace }}/focalboard/server/services/telemetry/telemetry.go

    - name: npm ci
      run: cd focalboard/webapp; npm ci --no-optional

    - name: Set up Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version: 1.21

    - name: Install Wails CLI
      shell: bash
      run: |
        go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Setup MinGW (cgo compiler for SQLite)
      shell: pwsh
      run: choco install mingw -y --no-progress

    - name: Verify C toolchain (cgo SQLite)
      shell: bash
      run: gcc --version

    - name: Build Windows Wails app
      shell: bash
      run: cd focalboard; make win-app-wails
      env:
        BUILD_NUMBER: ${{ github.run_id }}
        CGO_ENABLED: 1

    - name: Package Windows app
      shell: pwsh
      run: |
        $bin = "focalboard/desktop/build/bin"
        Copy-Item -Recurse -Force focalboard/webapp/pack "$bin/pack"
        Copy-Item -Force focalboard/NOTICE.txt "$bin/NOTICE.txt"
        Copy-Item -Force focalboard/webapp/NOTICE.txt "$bin/webapp-NOTICE.txt"
        Compress-Archive -Path "$bin/Focalboard.exe","$bin/pack","$bin/NOTICE.txt","$bin/webapp-NOTICE.txt" -DestinationPath "$bin/focalboard-win.zip" -Force

    - name: Upload app zip package
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: focalboard-win.zip
        path: ${{ github.workspace }}/focalboard/desktop/build/bin/focalboard-win.zip
  
