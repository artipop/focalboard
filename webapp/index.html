<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
    <meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0'>

    <title>Focalboard</title>

    <!-- The BaseURL below is a Go text/template action: the server substitutes it
         when serving this file (server/web/webserver.go), and vite.config.mjs
         replaces it with an empty string when the Vite dev server serves it. -->
    <script>window.baseURL = '{{.BaseURL}}'</script>
    <link rel="icon" href="{{.BaseURL}}/static/favicon.svg?v=1" />
</head>

<body class="focalboard-body">
	<div id="focalboard-app">
	</div>

	<div id="focalboard-root-portal">
	</div>

	<script type="module" src="/src/main.tsx"></script>
</body>

</html>
